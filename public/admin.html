<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pakan Ternak Pak Dehpri</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased py-8 px-4 sm:px-6">

  <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-gray-100 p-6 md:p-8 space-y-8">
    
    <!-- Header Admin -->
    <div class="text-center space-y-1 border-b border-gray-100 pb-5">
      <h2 class="text-2xl font-extrabold text-gray-900 flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-shield text-brand-600"></i> Panel Admin Toko
      </h2>
      <p class="text-xs text-gray-500 font-medium">Kelola katalog pakan dan media toko Pak Dehpri</p>
    </div>

    <!-- Form Tambah Produk -->
    <form id="form-tambah" class="space-y-4">
      <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-brand-600"></i> Tambah Produk Pakan
      </h3>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-700">Nama Produk Pakan:</label>
        <input type="text" id="nama" required placeholder="Contoh: Pakan Perkutut Phoenix" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition-all">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700">Stok (KG / Sak):</label>
          <input type="number" id="stok" required placeholder="Contoh: 100" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition-all">
        </div>
        <div class="space-y-1">
          <label class="block text-xs font-semibold text-gray-700">Harga (Rp):</label>
          <input type="number" id="harga" required placeholder="Contoh: 15000" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition-all">
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-700">Deskripsi Produk:</label>
        <textarea id="deskripsi" rows="2" placeholder="Special Formula Anti Stress..." class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition-all"></textarea>
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-700">URL Foto Produk / Link Gambar:</label>
        <input type="url" id="gambarUrl" placeholder="https://images.unsplash.com/..." class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-500 focus:outline-none focus:ring-4 focus:ring-brand-500/10 transition-all">
        <p class="text-[11px] text-gray-400">Kosongkan jika ingin menggunakan gambar default.</p>
      </div>

      <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs py-3 px-4 rounded-xl shadow-md shadow-brand-600/20 transition-all">
        Simpan Produk Baru
      </button>
    </form>

    <hr class="border-gray-100">

    <!-- Tabel Data Produk -->
    <div class="space-y-4">
      <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
        <i class="fa-solid fa-boxes-stacked text-brand-600"></i> Kelola Data Produk
      </h3>
      <div class="overflow-x-auto border border-gray-100 rounded-2xl shadow-sm">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-100 text-gray-600 font-bold">
              <th class="p-3 text-center">Foto</th>
              <th class="p-3">Nama & Deskripsi</th>
              <th class="p-3">Harga & Stok</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-produk-body" class="divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-400 font-medium">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <hr class="border-gray-100">

    <!-- Form Upload Musik -->
    <form id="form-musik" class="space-y-4">
      <h3 class="font-bold text-gray-900 text-base flex items-center gap-2">
        <i class="fa-solid fa-music text-brand-600"></i> Upload Musik Latar dari HP
      </h3>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-gray-700">Pilih File Musik (.mp3):</label>
        <input type="file" id="fileMusik" accept="audio/mp3,audio/*" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 transition-all">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 px-4 rounded-xl shadow-md transition-all">
        Upload & Simpan Musik
      </button>
    </form>

    <div class="pt-4 text-center">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-brand-600 transition-colors">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Halaman Utama Toko
      </a>
    </div>

  </div>

  <script>
    // Memuat Data Produk dari Express API
    async function muatTabelAdmin() {
      try {
        const res = await fetch('/api/pakan');
        const result = await res.json();
        const tbody = document.getElementById('tabel-produk-body');
        tbody.innerHTML = '';
        
        const data = result.data || [];
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400 font-medium">Belum ada produk tersimpan.</td></tr>`;
          return;
        }

        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50/50 transition-colors";
          tr.innerHTML = `
            <td class="p-3 text-center">
              <img src="${item.gambar}" class="w-10 h-10 object-cover rounded-lg mx-auto border border-gray-100" alt="Foto">
            </td>
            <td class="p-3">
              <span class="font-bold text-gray-900">${item.nama}</span>
              <p class="text-gray-400 text-[10px] line-clamp-1">${item.deskripsi || '-'}</p>
            </td>
            <td class="p-3">
              <span class="font-bold text-brand-600">Rp ${(item.harga || 0).toLocaleString('id-ID')}</span>
              <p class="text-gray-500 text-[10px]">Stok: <b class="text-gray-700">${item.stok}</b></p>
            </td>
            <td class="p-3 text-center">
              <button onclick="hapusProduk('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-2.5 py-1.5 rounded-lg text-[10px] transition-colors shadow-sm">
                Hapus
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
      }
    }

    muatTabelAdmin();

    // Fungsi Hapus Produk dengan Handling DELETE API
    async function hapusProduk(id) {
      if (!confirm('Yakin ingin menghapus produk ini?')) return;

      try {
        const res = await fetch(`/api/pakan/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await res.json();

        if (result.success) {
          alert('Produk berhasil dihapus!');
          muatTabelAdmin();
        } else {
          alert('Gagal menghapus produk: ' + result.message);
        }
      } catch (err) {
        console.error(err);
        alert('Terjadi kesalahan koneksi server.');
      }
    }

    // Submit Form Tambah Produk (Format JSON)
    document.getElementById('form-tambah').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const payload = {
        nama: document.getElementById('nama').value,
        stok: document.getElementById('stok').value,
        harga: document.getElementById('harga').value,
        deskripsi: document.getElementById('deskripsi').value,
        gambar: document.getElementById('gambarUrl').value
      };

      try {
        const res = await fetch('/api/pakan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert('Produk berhasil ditambahkan!');
          document.getElementById('form-tambah').reset();
          muatTabelAdmin();
        } else {
          alert('Gagal menambahkan produk.');
        }
      } catch (err) {
        console.error(err);
        alert('Gagal menambahkan produk.');
      }
    });

    // Submit Form Upload Musik (Placeholder Action)
    document.getElementById('form-musik').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Musik berhasil di-upload!');
      document.getElementById('form-musik').reset();
    });
  </script>

</body>
</html>
