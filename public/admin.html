<!DOCTYPE html>
<html lang="id">
<head>
    <script>
        window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Toko - Pak Dehpri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <!-- Navbar Admin -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-leaf text-lg"></i>
                </div>
                <span class="font-bold text-gray-900 text-lg">Pak Dehpri Admin</span>
            </div>
            <a href="/" class="text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-4 py-2 rounded-xl transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Toko
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">
        
        <div>
            <h1 class="text-2xl font-extrabold text-gray-900">Panel Admin Toko</h1>
            <p class="text-xs text-gray-500 font-medium mt-1">Kelola ringkasan stok, pendaftaran pakan baru, dan data produk.</p>
        </div>

        <!-- Ringkasan Statistik -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-gray-400">Total Produk</p>
                    <h3 id="stat-total-produk" class="text-3xl font-extrabold text-gray-900 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-gray-400">Total Stok Pakan</p>
                    <h3 id="stat-total-stok" class="text-3xl font-extrabold text-gray-900 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-gray-400">Kategori Aktif</p>
                    <h3 id="stat-kategori" class="text-3xl font-extrabold text-gray-900 mt-1">4</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-wheat-awn"></i>
                </div>
            </div>
        </div>

        <!-- Form & Table Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Form Tambah Produk -->
            <div class="lg:col-span-5 bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
                <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-emerald-600"></i> Tambah Produk Pakan
                </h2>

                <form id="form-tambah" class="space-y-4">
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-gray-700">Nama Produk Pakan</label>
                        <input type="text" id="nama" required placeholder="Contoh: Pakan Perkutut Phoenix" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-700">Stok (Sak / KG)</label>
                            <input type="number" id="stok" required placeholder="50" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-gray-700">Harga (Rp)</label>
                            <input type="number" id="harga" required placeholder="380000" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-gray-700">Deskripsi Ringkas</label>
                        <textarea id="deskripsi" rows="3" placeholder="Formula pakan bernutrisi tinggi..." class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-gray-700">URL Gambar / Foto Produk</label>
                        <input type="url" id="gambarUrl" placeholder="https://storage.googleapis.com/..." class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl text-sm focus:bg-white focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all">
                        Simpan Produk Baru
                    </button>
                </form>
            </div>

            <!-- Tabel Kelola Data -->
            <div class="lg:col-span-7 bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm space-y-6">
                <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-emerald-600"></i> Kelola Data Produk
                </h2>

                <div class="overflow-x-auto rounded-2xl border border-gray-100">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold uppercase tracking-wider">
                                <th class="p-4 text-center">Foto</th>
                                <th class="p-4">Nama & Deskripsi</th>
                                <th class="p-4">Harga & Stok</th>
                                <th class="p-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-body" class="divide-y divide-gray-100">
                            <!-- Data akan otomatis di-render oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        const defaultData = [
            {
                id: "1",
                nama: "Pakan Ayam Broiler Premium (50kg)",
                harga: 425000,
                stok: 50,
                gambar: "https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a8b8e00158_9b1f07d81d8e5fb8.png",
                deskripsi: "Pakan berkadar protein tinggi untuk pertumbuhan optimal ayam broiler."
            },
            {
                id: "2",
                nama: "Pakan Bebek Petelur Berkualitas",
                harga: 380000,
                stok: 30,
                gambar: "https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a8b8e00158_9692e9ce95daca77.png",
                deskripsi: "Nutrisi lengkap untuk meningkatkan kualitas dan produksi telur bebek."
            }
        ];

        function getStoredData() {
            const stored = localStorage.getItem('dataPakanStore');
            if (!stored) {
                localStorage.setItem('dataPakanStore', JSON.stringify(defaultData));
                return defaultData;
            }
            return JSON.parse(stored);
        }

        function renderAdmin() {
            const data = getStoredData();
            const tbody = document.getElementById('tabel-body');
            tbody.innerHTML = '';

            // Update Statistik
            document.getElementById('stat-total-produk').innerText = data.length;
            const totalStok = data.reduce((acc, curr) => acc + (Number(curr.stok) || 0), 0);
            document.getElementById('stat-total-stok').innerText = totalStok;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400 font-medium">Belum ada produk tersimpan.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/50 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 text-center">
                        <img src="${item.gambar}" class="w-12 h-12 object-cover rounded-xl mx-auto border border-gray-100 shadow-sm" alt="Foto">
                    </td>
                    <td class="p-4">
                        <span class="font-bold text-gray-900 block text-sm">${item.nama}</span>
                        <p class="text-gray-400 text-[11px] line-clamp-1 mt-0.5">${item.deskripsi || '-'}</p>
                    </td>
                    <td class="p-4">
                        <span class="font-bold text-emerald-600 block text-sm">Rp ${(Number(item.harga) || 0).toLocaleString('id-ID')}</span>
                        <p class="text-gray-500 text-[11px] mt-0.5">Stok: <b class="text-gray-700">${item.stok}</b></p>
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="hapusProduk('${item.id}')" class="bg-red-500 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition-colors shadow-sm">
                            Hapus
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function hapusProduk(id) {
            if (!confirm('Yakin ingin menghapus produk pakan ini?')) return;
            let data = getStoredData();
            data = data.filter(item => String(item.id) !== String(id));
            localStorage.setItem('dataPakanStore', JSON.stringify(data));
            renderAdmin();
        }

        document.getElementById('form-tambah').addEventListener('submit', function(e) {
            e.preventDefault();
            const newProduct = {
                id: String(Date.now()),
                nama: document.getElementById('nama').value,
                stok: Number(document.getElementById('stok').value) || 0,
                harga: Number(document.getElementById('harga').value) || 0,
                deskripsi: document.getElementById('deskripsi').value,
                gambar: document.getElementById('gambarUrl').value || "https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a8b8e00158_9b1f07d81d8e5fb8.png"
            };

            const data = getStoredData();
            data.push(newProduct);
            localStorage.setItem('dataPakanStore', JSON.stringify(data));

            document.getElementById('form-tambah').reset();
            renderAdmin();
        });

        renderAdmin();
    </script>
</body>
</html>
